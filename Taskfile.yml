version: "3"

env:
  PROJECT_PKG: app

  BINARY_NAME: fakeZebraPrinter
  BUILD_DIR: __dist
  BUILD_FILE: "{{.BUILD_DIR}}/{{.BINARY_NAME}}.exe"

  LDFLAGS: -ldflags="-s -w"

tasks:
  build:
    desc: Build the go binary.
    cmds:
      - go build -v {{.LDFLAGS}} -o {{.BUILD_FILE}}
      #- upx --best {{.RELEASE_FILE}}
    #ignore_error: true
  check-updates:
    desc: Available minor and patch upgrades for all direct and indirect dependencies.
    cmd: go list -m -u all
  upgrade:
    desc: This upgrades to the latest or minor patch release.
    cmd: go get -u ./...
